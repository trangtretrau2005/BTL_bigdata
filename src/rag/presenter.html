<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Times New Roman",Times,serif;color:#203d48;background:transparent}
.studio{display:grid;grid-template-columns:240px 1fr;min-height:330px;background:#fffefb;border:1px solid #ddd8ca;border-radius:18px;overflow:hidden}
.portrait{position:relative;background:radial-gradient(ellipse at 50% 30%,#e9eee7,#d3dfd6);overflow:hidden;min-height:330px}
.portrait:after{content:"";position:absolute;inset:14px;border:1px solid #ffffff85;border-radius:120px 120px 8px 8px;pointer-events:none}
.portrait svg{position:absolute;width:100%;height:100%;bottom:-6px;filter:drop-shadow(0 12px 15px #23433715)}
.portrait-label{position:absolute;bottom:13px;left:20px;right:20px;color:#fff7df;font-size:13px;text-align:center;letter-spacing:.5px;background:#193e46ed;border-radius:20px;padding:7px 8px;z-index:2}
.content{padding:24px 28px;display:flex;flex-direction:column;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.eyebrow{color:#947444;font-size:11px;letter-spacing:2px;text-transform:uppercase}h2{font-size:24px;font-weight:400;margin:7px 0 0}
.badge{font-size:13px;white-space:nowrap;color:#55776b;background:#edf3eb;border:1px solid #dee8dc;border-radius:30px;padding:6px 10px}
.subtitle{margin:20px 0 12px;font-size:19px;line-height:1.55;min-height:89px;max-height:110px;overflow:auto;scrollbar-width:thin}
.wave{height:23px;display:flex;align-items:center;gap:3px;margin:0 0 12px}.wave i{display:block;width:3px;height:3px;border-radius:2px;background:#b58e55;transition:height .08s}
.transport{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}button,select{font:16px "Times New Roman",serif;border:1px solid #d8d6c9;border-radius:8px;background:#fffefa;color:#203d48;padding:9px 13px;cursor:pointer}
button:hover{background:#f0f1e8}button:focus-visible,select:focus-visible{outline:2px solid #b28b4d;outline-offset:2px}button.primary{background:#20434a;color:#fff9eb;border-color:#20434a;min-width:114px}button:disabled{opacity:.5;cursor:default}
.count{font-size:13px;color:#6d7b7b;margin-left:auto}.hint{font-size:13px;color:#6c7977;margin:10px 0 0;line-height:1.4}
audio{width:100%;height:32px;margin:8px 0 0;accent-color:#20434a}audio:not([src]){display:none}
.male .female-only,.female .male-only{display:none}.compact{grid-template-columns:1fr}.compact .portrait{display:none}
.breath{transform-origin:160px 290px;animation:breathe 5s ease-in-out infinite}.eyes{transform-origin:160px 130px;animation:blink 6.7s infinite}
@keyframes breathe{50%{transform:translateY(-1.5px) rotate(.2deg)}}@keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.08)}}
@media(prefers-reduced-motion:reduce){.breath,.eyes{animation:none}}
@media(max-width:560px){.studio{grid-template-columns:110px 1fr;min-height:330px}.portrait{min-height:330px}.portrait svg{width:230px;left:50%;transform:translateX(-50%)}.portrait-label{left:4px;right:4px;font-size:11px}.content{padding:18px 14px}.top{display:block}.badge{display:inline-block;margin-top:8px}.subtitle{font-size:17px;margin-top:12px;min-height:100px}.transport{gap:5px}button,select{padding:8px;font-size:14px}.count{width:100%;margin:0}.compact{grid-template-columns:1fr}}
</style>

</g></svg><div class="portrait-label" id="presenterName">Minh Anh · Trợ lý tra cứu</div></div>
<div class="content"><div class="top"><div><div class="eyebrow">Lắng nghe để hiểu rõ hơn</div><h2>Chính sách, qua lời kể.</h2></div><span class="badge" id="state" role="status">Sẵn sàng</span></div>
<div class="subtitle" id="subtitle" aria-live="polite">Chọn một câu trả lời để bắt đầu nghe.</div><div class="wave" id="wave" aria-hidden="true"></div>
<div class="transport"><button class="primary" id="play" aria-label="Phát hoặc tạm dừng giọng đọc">▶ Phát</button><button id="restart" aria-label="Đọc lại từ đầu">↺ Đọc lại</button>
<select id="speed" aria-label="Tốc độ phát"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option></select><span class="count" id="count"></span></div>
<audio id="audio" controls preload="metadata" aria-label="Âm thanh và thanh tua trong đoạn hiện tại"></audio><p class="hint" id="hint"></p></div></div>
<script>
'use strict';
const CONFIG=__PRESENTER_CONFIG__;
const el=id=>document.getElementById(id),audio=el('audio'),mouth=el('mouth');
el('studio').classList.add(CONFIG.gender);if(!CONFIG.showAvatar)el('studio').classList.add('compact');
if(CONFIG.gender==='male')el('presenterName').textContent='Minh Khang · Trợ lý tra cứu';el('state').textContent=CONFIG.statusLabel;
const segments=CONFIG.segments||[],phrases=segments.length?segments.map(s=>s.text):(CONFIG.sentences||[]);
let index=0,playing=false,paused=false,ended=false,run=0,browserMode=!segments.length,context=null,analyser=null,samples=null,utter=null,speed=1,frame=0;
const bars=Array.from({length:28},()=>{const i=document.createElement('i');el('wave').appendChild(i);return i});
const setState=text=>el('state').textContent=text;
function showPhrase(){el('subtitle').textContent=phrases[index]||CONFIG.spokenText||'Tạo giọng đọc hoặc chọn một câu trả lời để nghe.';el('count').textContent=phrases.length?'Đoạn '+(index+1)+' / '+phrases.length:'';}
function setPlaying(active){playing=active;paused=false;el('play').textContent=active?'Ⅱ Tạm dừng':'▶ Phát';}
function connectAudio(){try{if(!context){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;context=new C();analyser=context.createAnalyser();analyser.fftSize=256;samples=new Uint8Array(analyser.fftSize);const src=context.createMediaElementSource(audio);src.connect(analyser);analyser.connect(context.destination);}if(context.state==='suspended')context.resume().catch(()=>{});}catch(e){analyser=null;}}
function finish(){setPlaying(false);ended=true;mouth.setAttribute('ry','.8');setState('Đã đọc xong');}
function stop(){run++;audio.pause();audio.currentTime=0;if(window.speechSynthesis)window.speechSynthesis.cancel();utter=null;setPlaying(false);ended=false;}
function advance(){index++;if(index<phrases.length){showPhrase();playSegment();}else{index=Math.max(0,phrases.length-1);finish();}}
async function browserVoice(){let voices=window.speechSynthesis.getVoices();if(!voices.length){await new Promise(resolve=>{const timer=setTimeout(resolve,1000);window.speechSynthesis.addEventListener('voiceschanged',()=>{clearTimeout(timer);resolve();},{once:true});});voices=window.speechSynthesis.getVoices();}return voices.find(v=>/^vi(?:-|_)/i.test(v.lang)&&(!CONFIG.deviceLocalOnly||v.localService));}
async function playSegment(){const token=++run;showPhrase();setState('Đang chuẩn bị');
if(!browserMode){if(!audio.src||audio.dataset.segment!==String(index)){audio.src='data:'+(segments[index].mime||'audio/mpeg')+';base64,'+segments[index].audio_b64;audio.dataset.segment=String(index);}audio.playbackRate=CONFIG.rate*speed;connectAudio();try{await audio.play();if(token!==run){audio.pause();return;}}catch(e){setPlaying(false);setState('Nhấn Phát để nghe');el('hint').textContent='Trình duyệt chưa phát được âm thanh. Thử nút phát trên thanh âm thanh hoặc tạo lại giọng đọc.';}}
else{if(!window.speechSynthesis){setState('Chưa hỗ trợ giọng đọc');return;}const voice=await browserVoice();if(token!==run)return;if(!voice){setState('Thiết bị chưa có giọng Việt');el('hint').textContent='Chưa tìm thấy giọng tiếng Việt trên thiết bị. Hãy nhấn Tạo lại âm thanh để thử dịch vụ giọng đọc.';return;}
utter=new SpeechSynthesisUtterance(phrases[index]);utter.voice=voice;utter.lang='vi-VN';utter.rate=CONFIG.rate*speed;utter.onstart=()=>{if(token===run){setPlaying(true);setState('Đang đọc');}};utter.onend=()=>{if(token===run)setTimeout(()=>{if(token===run)advance();},220);};utter.onerror=e=>{if(token===run&&e.error!=='interrupted'&&e.error!=='canceled'){setPlaying(false);setState('Chưa phát được giọng Việt');}};window.speechSynthesis.speak(utter);}}
el('play').onclick=()=>{if(playing){if(browserMode)window.speechSynthesis.pause();else audio.pause();playing=false;paused=true;el('play').textContent='▶ Tiếp tục';setState('Tạm dừng');return;}if(paused){paused=false;if(browserMode){window.speechSynthesis.resume();setPlaying(true);setState('Đang đọc');}else audio.play().catch(()=>setState('Nhấn Phát để nghe'));return;}if(ended){index=0;audio.removeAttribute('src');ended=false;}playSegment();};
el('restart').onclick=()=>{stop();index=0;audio.removeAttribute('src');showPhrase();playSegment();};
el('speed').onchange=e=>{speed=Number(e.target.value);audio.playbackRate=CONFIG.rate*speed;if(browserMode&&(playing||paused)){stop();playSegment();}};
audio.onplay=()=>{setPlaying(true);setState('Đang đọc');connectAudio();};audio.onpause=()=>{if(!audio.ended&&playing){playing=false;paused=true;el('play').textContent='▶ Tiếp tục';setState('Tạm dừng');}};audio.onended=advance;
audio.onerror=()=>{setPlaying(false);setState('Lỗi âm thanh');el('hint').textContent='Âm thanh chưa tải được. Bạn hãy tạo lại giọng đọc.';};
el('hint').textContent=(CONFIG.provider==='edge'?'Giọng nữ · Hoài My':CONFIG.provider==='piper'?'Giọng đọc dự phòng · Piper':CONFIG.provider==='google'?'Giọng đọc dự phòng · Google':'Giọng trên thiết bị · cần có giọng tiếng Việt')+'. Chuyển động miệng minh họa theo nhịp âm thanh.';
if(!CONFIG.spokenText){el('play').disabled=true;el('restart').disabled=true;}
function animate(t){let energy=0;if(playing){if(analyser&&samples&&!browserMode){analyser.getByteTimeDomainData(samples);let sum=0;for(const s of samples)sum+=((s-128)/128)**2;energy=Math.min(1,Math.sqrt(sum/samples.length)*5);}else if(browserMode){energy=.25+Math.abs(Math.sin(t*.012)*Math.cos(t*.004))*.45;}}mouth.setAttribute('ry',String(.8+energy*6));mouth.setAttribute('rx',String(14-energy*3));bars.forEach((bar,i)=>{bar.style.height=(3+energy*(7+15*Math.abs(Math.sin(i*.8+t*.005))))+'px';});frame=requestAnimationFrame(animate);}
showPhrase();frame=requestAnimationFrame(animate);window.addEventListener('pagehide',()=>{stop();cancelAnimationFrame(frame);if(context)context.close().catch(()=>{});});if(CONFIG.autoPlay&&CONFIG.spokenText)playSegment();
</script></html>
