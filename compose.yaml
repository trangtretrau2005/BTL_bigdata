name: ai-law-lake
services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
  ollama:
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /hadoop/name; if [ ! -f /hadoop/name/current/VERSION ]; then hdfs namenode -format -nonInteractive; fi; exec hdfs namenode"]
    environment:
      HADOOP_CONF_DIR: /etc/hadoop
      HADOOP_HEAPSIZE_MAX: "256"
    volumes:
      - ./docker/hadoop:/etc/hadoop:ro
      - namenode_data:/hadoop/name
    ports: ["127.0.0.1:9870:9870"]
    restart: unless-stopped
  datanode:
    image: apache/hadoop:3.4.1
    hostname: datanode
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /hadoop/data; exec hdfs datanode"]
    environment:
      HADOOP_CONF_DIR: /etc/hadoop
      HADOOP_HEAPSIZE_MAX: "256"
    volumes:
      - ./docker/hadoop:/etc/hadoop:ro
      - datanode_data:/hadoop/data
    depends_on: [namenode]
    restart: unless-stopped
  app:
    build: .
    image: ai-law-lake-app:local
    working_dir: /app
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      HDFS_WEB_URL: http://namenode:9870
      SPARK_LOCAL_IP: 127.0.0.1
    ports: ["127.0.0.1:8501:8501"]
    volumes: ["./:/app"]
    depends_on:
      qdrant: {condition: service_started}
      ollama: {condition: service_healthy}
      namenode: {condition: service_started}
      datanode: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health',timeout=3).raise_for_status()"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  qdrant_data:
  ollama_models:
  namenode_data:
  datanode_data:
